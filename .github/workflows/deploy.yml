name: Deploy Buywiz Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::040997781797:role/BuywizGitHubDeploy
          aws-region: eu-central-1

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          aws-region: eu-central-1
          application-name: buywiz-website
          environment-name: Buywiz-website-env
          create-application-if-not-exists: false
          create-environment-if-not-exists: false
          version-label: github-${{ github.sha }}
          deployment-timeout: 1800
